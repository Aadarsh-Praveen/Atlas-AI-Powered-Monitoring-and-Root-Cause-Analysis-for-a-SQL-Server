  <text x="32" y="47" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="900" fill="#20231f">S</text>
</svg>
