# .github/workflows/vm-schedule.yml: start or deallocate prod-sql-01.
#
# Business hours are moving to Azure Logic Apps (infra/vm-schedule-logic-apps.md),
# because GitHub's scheduler can run hours late or not at all: on Monday
# 2026-11-23 the 13:00 start arrived at 00:30 UTC the next day and started the
# VM at night, and the 23:00 deallocate never came. TEMPORARY: the schedule
# below stays until the Logic Apps are verified; then only manual runs remain.
#
# Schedule (cron is always UTC; Boston shifts by an hour with daylight saving):
#   start       13:00 UTC Mon-Fri = 9 AM Boston in summer (EDT), 8 AM in winter (EST)
#   deallocate  23:00 UTC Mon-Fri = 7 PM Boston in summer,        6 PM in winter
# The VM's own auto-shutdown (04:00 UTC) stays as a safety net. Weekends: off.
#
# Time guard (first step), so a late run can't do the wrong thing:
#   start       only Mon-Fri 12:30-21:00 UTC, scheduled or manual. Outside it
#               the run skips, says why in the summary, and stays green.
#               Manual runs can override it: force_start (maintenance).
#   deallocate  manual: always. Scheduled: only OUTSIDE business hours (not
#               Mon-Fri 12:30-22:30 UTC): a scheduled deallocate that arrives
#               then is yesterday's, hours late, and would stop the VM mid-day.
#
# Sign-in: OpenID Connect (OIDC). GitHub gives this run a short-lived token,
# and Azure trusts it because a user-assigned managed identity has a federated
# credential for this repo's main branch. No Azure password or key is stored
# in GitHub. The identity can only read, start, and deallocate prod-sql-01
# (a custom role scoped to that one VM). Setup: docs in B5 (OIDC guide).
#
# Not affected by TRAFFIC_ENABLED: pausing traffic doesn't change the VM's hours.

name: VM schedule

on:
  schedule:
    - cron: "0 13 * * 1-5"      # start
    - cron: "0 23 * * 1-5"      # deallocate
  workflow_dispatch:
    inputs:
      action:
        description: "What to do with prod-sql-01"
        type: choice
        options: [start, deallocate]
        default: start
      force_start:
        description: "Start even outside weekdays 12:30-21:00 UTC (maintenance). Deallocate it yourself afterwards."
        type: boolean
        default: false

permissions:
  id-token: write               # request the OIDC token for Azure sign-in
  contents: read

concurrency:
  group: vm-schedule            # never start and stop at the same time
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-shoplite-prod
  VM_NAME: prod-sql-01

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide what to do (time guard)
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
          FORCE_START: ${{ inputs.force_start }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            action="$INPUT_ACTION"
          elif [ "$SCHEDULE" = "0 13 * * 1-5" ]; then
            action=start
          else
            action=deallocate
          fi

          # Now, in UTC: weekday 1-7 (Mon=1) and HHMM as a number (e.g. 1230).
          day=$(date -u +%u); hhmm=$((10#$(date -u +%H%M))); now=$(date -u '+%A %H:%M UTC')
          weekday=false; [ "$day" -le 5 ] && weekday=true

          run=true; reason=""
          if [ "$action" = "start" ]; then
            if [ "$weekday" = true ] && [ "$hhmm" -ge 1230 ] && [ "$hhmm" -lt 2100 ]; then
              reason="inside the start window"
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE_START" = "true" ]; then
              reason="FORCED outside the start window (force_start): deallocate it when you're done"
            else
              run=false
              reason="$now is outside the start window (weekdays 12:30-21:00 UTC)"
              [ "$EVENT" = "schedule" ] && reason="$reason: a late scheduled run (GitHub's scheduler)"
              [ "$EVENT" = "workflow_dispatch" ] && reason="$reason. To start anyway, run again with force_start"
            fi
          elif [ "$EVENT" = "schedule" ] && [ "$weekday" = true ] && [ "$hhmm" -ge 1230 ] && [ "$hhmm" -lt 2230 ]; then
            run=false
            reason="$now is inside business hours: this scheduled deallocate is yesterday's, arriving late (GitHub's scheduler)"
          else
            reason="deallocate is allowed now"
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Action: $action ($EVENT, $now). Run: $run. $reason"
          if [ "$run" = false ]; then
            echo "### prod-sql-01: $action **skipped**" >> "$GITHUB_STEP_SUMMARY"
            echo "$reason. Nothing was changed." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FORCE_START" = "true" ] && [ "$action" = "start" ]; then
            echo "⚠️ $reason." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sign in to Azure (OIDC, no stored password)
        if: steps.decide.outputs.run == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start the VM
        id: start
        if: steps.decide.outputs.run == 'true' && steps.decide.outputs.action == 'start'
        run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      - name: Deallocate the VM (stops compute billing)
        if: steps.decide.outputs.run == 'true' && steps.decide.outputs.action == 'deallocate'
        run: az vm deallocate --resource-group "$RESOURCE_GROUP" --name "$VM_NAME"

      # After a skip there's no Azure sign-in, so nothing to report.
      - name: Report the power state
        if: ${{ !cancelled() && steps.decide.outputs.run == 'true' }}
        run: |
          state=$(az vm get-instance-view --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" -o tsv || echo unknown)
          echo "prod-sql-01: $state"
          echo "### prod-sql-01: ${{ steps.decide.outputs.action }} → **$state**" >> "$GITHUB_STEP_SUMMARY"

      # Information only: the services start on their own after boot. This
      # shows how long until the API answers, and never fails the run.
      #
      # Runs exactly when the "Start the VM" step succeeded (manual or
      # scheduled). The condition names a status function (!cancelled()) on
      # purpose: an `if:` WITHOUT one gets an invisible `success() &&` in
      # front, which would skip this step if any earlier step had failed. The
      # API_URL check is inside the script, so a missing variable produces a
      # clear message instead of a silent skip.
      - name: Wait for the API to come up
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        continue-on-error: true
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::Repository variable API_URL is empty; can't check when the API is up."
            echo "⚠️ API_URL not set: API readiness not checked." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$API_URL/health" | grep -q '"status":"ok"'; then
              echo "API healthy after about $((i * 15)) seconds."
              echo "API healthy after about $((i * 15)) seconds." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "API not healthy after 10 minutes; check the VM (runbook, 'When the site is down')."
          echo "⚠️ API not healthy after 10 minutes." >> "$GITHUB_STEP_SUMMARY"
