# .github/workflows/load.yml: background load (Locust) on the production API
# during business hours, following the daily curve in shoplite/traffic/load/shape.py.
#
# Schedule (UTC, Mon-Fri):
#   :35 every hour, 13:35-22:35  (9:35 AM-6:35 PM Boston in summer, an hour
#                                 earlier in winter). Each session lasts 10
#                                 minutes at the level for that time of day,
#                                 so the day's sessions trace the curve.
#   Fridays 16:00 and 17:00      the flash sale (12:00-12:20 Boston) is 16:00
#                                 UTC in summer and 17:00 UTC in winter; one of
#                                 these two sessions lands in it, the other
#                                 runs at the normal level for its hour.
#
# Light by default: LOAD_PEAK_USERS 5 (repository variable to change it).
# The VM is burstable; watch CPU Credits Remaining before raising it.
#
# Safeguards: kill switch (TRAFFIC_ENABLED), health check first, one session
# at a time, a hard time limit, and Locust always runs here, never on the VM.

name: Load

on:
  schedule:
    - cron: "35 13-22 * * 1-5"
    - cron: "0 16,17 * * 5"       # Friday flash sale (DST-proof pair)
  workflow_dispatch:
    inputs:
      duration:
        description: "Session length in seconds"
        default: "300"
      peak_users:
        description: "Users at the busiest normal moment"
        default: "5"

permissions:
  contents: read

concurrency:
  group: load
  cancel-in-progress: false

jobs:
  load:
    if: vars.TRAFFIC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Check production health
        id: health
        run: |
          if curl -fsS --max-time 15 "$API_URL/health" | grep -q '"status":"ok"'; then
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            echo "## Load skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The API at $API_URL isn't healthy (the VM may be off). Nothing was run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v7
        if: steps.health.outputs.healthy == 'true'

      - uses: actions/setup-python@v7
        if: steps.health.outputs.healthy == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shoplite/traffic/load/requirements.txt

      - name: Install Locust
        if: steps.health.outputs.healthy == 'true'
        run: pip install -r shoplite/traffic/load/requirements.txt

      - name: Run Locust (headless, following the load shape)
        if: steps.health.outputs.healthy == 'true'
        env:
          SHOPLITE_ADMIN_TOKEN: ${{ secrets.SHOPLITE_ADMIN_TOKEN }}
          LOAD_DURATION_SECONDS: ${{ inputs.duration || '600' }}
          LOAD_PEAK_USERS: ${{ inputs.peak_users || vars.LOAD_PEAK_USERS || '5' }}
        # Locust exits 1 if any request counted as a failure (503s, unexpected
        # errors), which marks the run red: a real signal worth a look. The
        # summary is written first, then Locust's exit code is passed on.
        run: |
          status=0
          locust -f shoplite/traffic/load/locustfile.py --host "$API_URL" \
            --headless --html locust-report.html --only-summary || status=$?
          {
            echo "## Locust session"
            echo "Peak users: $LOAD_PEAK_USERS, duration: ${LOAD_DURATION_SECONDS}s, exit code: $status."
            echo "Open the locust-report artifact for per-endpoint response times and any failures."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the HTML report
        if: always() && steps.health.outputs.healthy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: locust-report-${{ github.run_id }}
          path: locust-report.html
          retention-days: 7
          if-no-files-found: ignore
